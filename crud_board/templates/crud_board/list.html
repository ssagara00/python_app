{% extends "base.html" %}

{% block title %}
一覧を表示する予定
{% endblock title %}

{% block content %}
<h1>ユーザー一覧</h1>

<table border="1">
    <thead>
        <tr>
            <td>名前</td>
            <td>Email</td>
        </tr>
    </thead>
    {% for user in users %}
    <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
